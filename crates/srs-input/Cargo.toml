[package]
name = "srs-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Owned desktop PTT input adapters with bounded freshness"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
sdl3 = { version = "=0.22.1", features = ["build-from-source-static"] }
# Configure the bundled C library too: Slint owns windows, CPAL owns audio.
# Positive subsystem features override no-default-subsystems in sdl3-sys.
sdl3-sys = { version = "=0.7.3", features = ["no-default-subsystems", "sdl-joystick", "sdl-hidapi", "sdl-unix-console-build"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3.32"
x11rb-async = "=0.14.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[lints.rust]
# Only the small Windows scalar key-state adapter permits audited FFI.
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb-async = { version = "=0.14.0", features = ["xtest"] }
serde = { version = "1.0.229", features = ["derive"] }
