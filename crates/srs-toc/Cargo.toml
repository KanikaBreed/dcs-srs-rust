[package]
name = "srs-toc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Owned SRS session, audio worker, and explicit desktop TOC console"

[dependencies]
srs-audio = { path = "../srs-audio" }
srs-client = { path = "../srs-client" }
srs-device = { path = "../srs-device" }
srs-protocol = { path = "../srs-protocol" }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
