name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Rust
        run: rustup show
      - name: Check native codec build tools
        run: cmake --version
      - name: Install Linux audio build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config libopus0 libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libx11-xcb-dev libx11-dev libxcursor-dev xinput xvfb xauth x11-utils fonts-dejavu-core
      - name: Check documentation and Rust workspace
        run: python scripts/check.py
      - name: Prepare native desktop validation build
        run: python scripts/build_desktop.py --out .scratch/desktop-ci
      - name: Verify isolated native null audio
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/test_null_audio.py
      - name: Compile fuzz targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Verify session against isolated stock SRS server
        if: matrix.os == 'ubuntu-latest'
        env:
          SRS_TEST_SUDO_NAMESPACE: '1'
        run: python scripts/test_stock_server.py
      - name: Set up .NET for independent upstream verification
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify fixtures against pinned upstream C#
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          srs_reference="$RUNNER_TEMP/srs-reference"
          git init "$srs_reference"
          git -C "$srs_reference" remote add origin https://github.com/ciribob/DCS-SimpleRadioStandalone.git
          git -C "$srs_reference" sparse-checkout set Common DCS-SR-CommonTests
          git -C "$srs_reference" fetch --depth 1 --filter=blob:none origin d01f540ce5e363e9ac841775c8f7e2253138cd81
          git -C "$srs_reference" checkout --detach FETCH_HEAD
          cargo run --locked -p srs-protocol --example roundtrip_fixtures -- crates/srs-protocol/tests/fixtures "$RUNNER_TEMP/rust-wire"
          python scripts/reference_fixtures.py --reference "$srs_reference" --verify-dir "$RUNNER_TEMP/rust-wire"
      - name: Verify Opus with original C# wrappers
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python scripts/test_reference_codec.py --reference "$RUNNER_TEMP/srs-reference"
